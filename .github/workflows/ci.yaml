name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      asan:
        description: 'Run ASan/UBSan test suite'
        type: boolean
        default: false

env:
  MESON_VERSION: 1.12.0

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: pip install --break-system-packages meson==${{ env.MESON_VERSION }} ninja

      - name: Cache subprojects
        uses: actions/cache@v4
        with:
          path: |
            subprojects/packagecache
            build-debug
          key: ${{ runner.os }}-meson-${{ hashFiles('meson.build', 'tests/meson.build', 'subprojects/*.wrap', 'native.ini') }}

      - name: Configure
        run: make debug

      - name: Build
        run: make build

      - name: Test
        run: make test-no-build

  asan:
    if: github.event_name == 'workflow_dispatch' && inputs.asan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: pip install --break-system-packages meson==${{ env.MESON_VERSION }} ninja

      - name: Cache subprojects
        uses: actions/cache@v4
        with:
          path: |
            subprojects/packagecache
            build-asan
          key: ${{ runner.os }}-meson-asan-${{ hashFiles('meson.build', 'tests/meson.build', 'subprojects/*.wrap', 'native.ini') }}

      - name: Test (ASan/UBSan)
        run: make test-asan
